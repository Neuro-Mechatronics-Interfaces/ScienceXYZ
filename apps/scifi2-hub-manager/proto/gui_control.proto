syntax = "proto3";

package stateful_decode_and_sync.v1;

// Typed control-plane messages for the scifi2-hub-manager App. The
// protocol version is deliberately carried in every envelope so a client can
// reject an incompatible device before interpreting any command or status.

enum CommandKind {
  COMMAND_UNSPECIFIED = 0;
  COMMAND_GET_STATE = 1;
  COMMAND_SUBSCRIBE_STATE = 2;
  COMMAND_PREPARE_CAPTURE = 3;
  COMMAND_SELECT_COLLECTION = 4;
  COMMAND_SELECT_LABEL = 5;
  COMMAND_SET_CAPTURE = 6;
  COMMAND_FIT = 7;
  COMMAND_FLUSH = 8;
  COMMAND_START_TASK = 9;
  COMMAND_PROPOSE_TASK_EVENT = 10;
  COMMAND_PROPOSE_TASK_TRANSITION = 11;
  COMMAND_ABORT_TASK = 12;
  COMMAND_RESET_TASK = 13;
  COMMAND_SET_EXO_MODE = 14;
  COMMAND_SET_EXO_POSE = 15;
}

// Engagement mode for the optional on-device NML_Hand_Exo link. The App owns
// the exo serial link directly (it is NOT a separate Synapse peripheral). OFF
// is the default and keeps the hand disarmed and untouched; EXTERNAL lets a
// host command poses over this control plane; DECODE lets the App's own decode
// output drive the hand through the configured per-class pose table.
enum ExoMode {
  EXO_MODE_UNSPECIFIED = 0;
  EXO_MODE_OFF = 1;
  EXO_MODE_EXTERNAL = 2;
  EXO_MODE_DECODE = 3;
}

// Fixed set_finger_angles joint order (firmware >= 0.6.4). Matches the SDK's
// SET_FINGER_ANGLES_ORDER and kFingerOrder in the firmware's utils.cpp.
enum ExoJoint {
  EXO_JOINT_UNSPECIFIED = 0;
  EXO_JOINT_THUMB = 1;
  EXO_JOINT_INDEX = 2;
  EXO_JOINT_MIDDLE = 3;
  EXO_JOINT_RING = 4;
  EXO_JOINT_PINKY = 5;
  EXO_JOINT_WRIST = 6;
}

// One joint target on the signed rest-anchored axis: -100 extend, 0 rest,
// +100 flex. A joint absent from a pose is held unchanged by the firmware.
message ExoJointValue {
  ExoJoint joint = 1;
  int32 value = 2;
}

message GetState {}

message SubscribeState {
  bool enabled = 1;
}

message PrepareCapture {
  uint32 collection_id = 1;
  uint32 label = 2;
  bool enabled = 3;
}

message SelectCollection {
  uint32 collection_id = 1;
}

message SelectLabel {
  uint32 label = 1;
}

message SetCapture {
  bool enabled = 1;
}

message Fit {
  // Zero means use the device's configured default epoch count.
  uint32 epochs = 1;
}

message Flush {
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_LABEL = 1;
    SCOPE_COLLECTION = 2;
    SCOPE_ALL = 3;
  }

  Scope scope = 1;
  // Omitted targets mean the currently active target. The explicit presence
  // flags distinguish an omitted target from an explicit target id of zero.
  bool has_collection_id = 2;
  uint32 collection_id = 3;
  bool has_label = 4;
  uint32 label = 5;
}

// Preconditions make task proposals optimistic and reconnect-safe.  A client
// obtains a fresh StateSnapshot rather than replaying a stale proposal.
message TaskPreconditions {
  string expected_app_session_id = 1;
  uint64 expected_run_sequence = 2;
  uint64 expected_transition_sequence = 3;
  bool has_expected_state_id = 4;
  uint32 expected_state_id = 5;
}

message StartTask { TaskPreconditions preconditions = 1; }

message ProposeTaskEvent {
  TaskPreconditions preconditions = 1;
  string event_name = 2;
}

message ProposeTaskTransition {
  TaskPreconditions preconditions = 1;
  uint32 transition_id = 2;
}

message AbortTask { TaskPreconditions preconditions = 1; }
message ResetTask { TaskPreconditions preconditions = 1; }

message SetExoMode {
  ExoMode mode = 1;
}

// A pose command for EXO_MODE_EXTERNAL. At least one joint value is required;
// unlisted joints are held. Rejected unless the exo is engaged (mode != OFF)
// and armed.
message SetExoPose {
  repeated ExoJointValue joints = 1;
}

message ControlCommand {
  uint32 protocol_version = 1;
  string request_id = 2;
  CommandKind command = 3;

  oneof payload {
    GetState get_state = 10;
    SubscribeState subscribe_state = 11;
    PrepareCapture prepare_capture = 12;
    SelectCollection select_collection = 13;
    SelectLabel select_label = 14;
    SetCapture set_capture = 15;
    Fit fit = 16;
    Flush flush = 17;
    StartTask start_task = 18;
    ProposeTaskEvent propose_task_event = 19;
    ProposeTaskTransition propose_task_transition = 20;
    AbortTask abort_task = 21;
    ResetTask reset_task = 22;
    SetExoMode set_exo_mode = 23;
    SetExoPose set_exo_pose = 24;
  }
}

enum ErrorCode {
  ERROR_NONE = 0;
  ERROR_MALFORMED = 1;
  ERROR_UNSUPPORTED_VERSION = 2;
  ERROR_UNKNOWN_COMMAND = 3;
  ERROR_INVALID_ARGUMENT = 4;
  ERROR_OUT_OF_RANGE = 5;
  ERROR_PIPELINE_NOT_READY = 6;
  ERROR_CAPTURE_ENABLED = 7;
  ERROR_BUSY = 8;
  ERROR_EMPTY_COLLECTION = 9;
  ERROR_DUPLICATE_REQUEST_ID = 10;
  ERROR_TIMEOUT = 11;
  ERROR_TRANSPORT_DISCONNECTED = 12;
  ERROR_INTERNAL = 13;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string field = 3;
  bool retryable = 4;
}

enum ResultStatus {
  RESULT_UNSPECIFIED = 0;
  RESULT_ACCEPTED = 1;
  RESULT_SUCCEEDED = 2;
  RESULT_FAILED = 3;
}

message FitProgress {
  uint32 epoch = 1;
  uint32 total_epochs = 2;
  float loss = 3;
  float accuracy = 4;
}

message CommandResult {
  uint32 protocol_version = 1;
  string request_id = 2;
  CommandKind command = 3;
  ResultStatus status = 4;
  uint64 state_version = 5;
  Error error = 6;
  FitProgress progress = 7;
}

enum PipelineState {
  PIPELINE_UNSPECIFIED = 0;
  PIPELINE_DISCONNECTED = 1;
  PIPELINE_NOT_READY = 2;
  PIPELINE_READY = 3;
  PIPELINE_ERROR = 4;
}

enum SourceMode {
  SOURCE_MODE_UNSPECIFIED = 0;
  SOURCE_MODE_SAMPLING = 1;
  SOURCE_MODE_SYNTHETIC = 2;
}

message PipelineStatus {
  PipelineState state = 1;
  SourceMode source_mode = 2;
}

message ActiveTarget {
  uint32 collection_id = 1;
  uint32 label = 2;
  bool capture_enabled = 3;
}

message LabelStatus {
  uint32 label = 1;
  uint32 count = 2;
  uint32 capacity = 3;
}

message CollectionStatus {
  uint32 collection_id = 1;
  uint32 feature_dimension = 2;
  uint64 data_generation = 3;
  repeated LabelStatus labels = 4;
}

enum ModelPhase {
  MODEL_UNSPECIFIED = 0;
  MODEL_IDLE = 1;
  MODEL_QUEUED = 2;
  MODEL_RUNNING = 3;
  MODEL_SUCCEEDED = 4;
  MODEL_FAILED = 5;
  MODEL_CANCELLED = 6;
}

message ModelStatus {
  ModelPhase phase = 1;
  bool ready = 2;
  bool has_source_collection_id = 3;
  uint32 source_collection_id = 4;
  uint64 source_generation = 5;
  bool stale = 6;
  uint32 epoch = 7;
  uint32 total_epochs = 8;
  float loss = 9;
  float accuracy = 10;
  uint64 duration_ms = 11;
}

enum TaskLifecycle {
  TASK_LIFECYCLE_UNSPECIFIED = 0;
  TASK_LIFECYCLE_IDLE = 1;
  TASK_LIFECYCLE_RUNNING = 2;
  TASK_LIFECYCLE_COMPLETED = 3;
  TASK_LIFECYCLE_ABORTED = 4;
  TASK_LIFECYCLE_FAULT = 5;
}

enum TaskEventKind {
  TASK_EVENT_UNSPECIFIED = 0;
  TASK_EVENT_START = 1;
  TASK_EVENT_TRANSITION = 2;
  TASK_EVENT_ABORT = 3;
  TASK_EVENT_RESET = 4;
}

enum TaskTriggerKind {
  TASK_TRIGGER_UNSPECIFIED = 0;
  TASK_TRIGGER_START_COMMAND = 1;
  TASK_TRIGGER_EXTERNAL_EVENT = 2;
  TASK_TRIGGER_SOURCE_TIMEOUT = 3;
  TASK_TRIGGER_DECODER_PREDICATE = 4;
  TASK_TRIGGER_ABORT_COMMAND = 5;
  TASK_TRIGGER_RESET_COMMAND = 6;
}

// The exact reference BroadbandFrame which first falls under a commit.
message TaskFrameBoundary {
  string source_id = 1;
  uint64 sequence_number = 2;
  uint64 timestamp_ns = 3;
}

// Complete replacement status for task authority.  The transition stream,
// not snapshots, is the loss-detectable event history.
message TaskStatus {
  bool configured = 1;
  string definition_id = 2;
  uint64 definition_revision = 3;
  string definition_hash = 4;
  string app_session_id = 5;
  TaskLifecycle lifecycle = 6;
  uint64 run_sequence = 7;
  uint64 event_sequence = 8;
  uint64 transition_sequence = 9;
  bool has_current_state_id = 10;
  uint32 current_state_id = 11;
  uint32 staged_command_count = 12;
  bool source_healthy = 13;
  string fault_reason = 14;
  bool has_effective_frame = 15;
  TaskFrameBoundary last_effective_frame = 16;
}

// Immutable authoritative event history.  event_sequence is session-wide;
// transition_sequence is scoped to run_sequence.
message TaskTransitionEvent {
  uint32 protocol_version = 1;
  string definition_id = 2;
  uint64 definition_revision = 3;
  string definition_hash = 4;
  string app_session_id = 5;
  uint64 run_sequence = 6;
  uint64 event_sequence = 7;
  uint64 transition_sequence = 8;
  TaskEventKind event_kind = 9;
  uint32 transition_id = 10;
  uint32 previous_state_id = 11;
  uint32 current_state_id = 12;
  TaskTriggerKind trigger_kind = 13;
  string trigger_source = 14;
  string request_id = 15;
  uint64 proposal_receipt_sequence = 16;
  uint64 proposal_receipt_time_ns = 17;
  TaskFrameBoundary effective_frame = 18;
}

// Optional on-device exo link status. Present only when exo support is enabled
// in config; `configured=false` otherwise. `link_open` and `armed` reflect the
// worker's last observation, `firmware_ok` whether the device reported a
// firmware that supports set_finger_angles (>= 0.6.4).
message ExoStatus {
  bool configured = 1;
  ExoMode mode = 2;
  bool link_open = 3;
  bool armed = 4;
  bool firmware_ok = 5;
  string firmware = 6;
  string last_error = 7;
  repeated ExoJointValue last_commanded = 8;
}

message StateSnapshot {
  uint32 protocol_version = 1;
  uint64 state_version = 2;
  uint64 timestamp_ns = 3;
  PipelineStatus pipeline = 4;
  ActiveTarget active = 5;
  repeated CollectionStatus collections = 6;
  ModelStatus model = 7;
  Error last_error = 8;
  TaskStatus task = 9;
  ExoStatus exo = 10;
}
