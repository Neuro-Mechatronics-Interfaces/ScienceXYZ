[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nml-science-xyz"
version = "0.4.0"
description = "Headless controller, loopback service, calibration client, and PySide6 dashboard"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "protobuf",
  "science-synapse>=2.2.7",
  "PySide6>=6.7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
waveform = ["pyqtgraph>=0.13"]
recording = ["h5py>=3.12", "matplotlib>=3.9", "websockets>=14,<17"]
# NML_Hand_Exo dual-CDC control. The SDK lives in the third_party/exo submodule;
# install it editable from there (run submodule update --init first):
#   pip install -e '../../../third_party/exo'
#   pip install -e '.[exo]'
# pyserial is what the worker's transport actually needs from the SDK's deps.
exo = ["pyserial>=3.5"]

[project.scripts]
service-main = "run_service:main"
gui-exo = "run_exo_gui:main"
exo-via-scifi = "exo_via_scifi:main"
gui-device = "run_gui:main"
gui-waveforms = "run_waveform:main"
gui-calibrate = "run_calibration_gui:main"
calibrate-prompter = "calibration_prompter:main"
demo = "run_fake_demo:main"
calibrate-gestures = "calibration_task:main"
task-reactions = "run_reactions_bridge:main"
analyze-recording = "analyze_recording:main"
calibrate-session = "run_calibration_session:main"
exo-service = "run_exo_service:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["run_exo_gui", "exo_via_scifi", "run_service", "run_gui", "run_waveform", "calibration_prompter", "run_fake_demo", "calibration_task", "run_reactions_bridge", "analyze_recording", "run_calibration_session", "run_calibration_gui", "run_exo_service"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
# Ship the GUI window/taskbar icon (see scifi2_hub_manager/appicon.py):
# the SVG for Qt window icons, the PNG for Linux/WSLg .desktop entries.
scifi2_hub_manager = ["assets/*.svg", "assets/*.png"]
