syntax = "proto3";

package stateful_decode_and_sync.v1;

// Typed control-plane messages for the stateful-decode-and-sync App. The
// protocol version is deliberately carried in every envelope so a client can
// reject an incompatible device before interpreting any command or status.

enum CommandKind {
  COMMAND_UNSPECIFIED = 0;
  COMMAND_GET_STATE = 1;
  COMMAND_SUBSCRIBE_STATE = 2;
  COMMAND_PREPARE_CAPTURE = 3;
  COMMAND_SELECT_COLLECTION = 4;
  COMMAND_SELECT_LABEL = 5;
  COMMAND_SET_CAPTURE = 6;
  COMMAND_FIT = 7;
  COMMAND_FLUSH = 8;
}

message GetState {}

message SubscribeState {
  bool enabled = 1;
}

message PrepareCapture {
  uint32 collection_id = 1;
  uint32 label = 2;
  bool enabled = 3;
}

message SelectCollection {
  uint32 collection_id = 1;
}

message SelectLabel {
  uint32 label = 1;
}

message SetCapture {
  bool enabled = 1;
}

message Fit {
  // Zero means use the device's configured default epoch count.
  uint32 epochs = 1;
}

message Flush {
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_LABEL = 1;
    SCOPE_COLLECTION = 2;
    SCOPE_ALL = 3;
  }

  Scope scope = 1;
  // Omitted targets mean the currently active target. The explicit presence
  // flags distinguish an omitted target from an explicit target id of zero.
  bool has_collection_id = 2;
  uint32 collection_id = 3;
  bool has_label = 4;
  uint32 label = 5;
}

message ControlCommand {
  uint32 protocol_version = 1;
  string request_id = 2;
  CommandKind command = 3;

  oneof payload {
    GetState get_state = 10;
    SubscribeState subscribe_state = 11;
    PrepareCapture prepare_capture = 12;
    SelectCollection select_collection = 13;
    SelectLabel select_label = 14;
    SetCapture set_capture = 15;
    Fit fit = 16;
    Flush flush = 17;
  }
}

enum ErrorCode {
  ERROR_NONE = 0;
  ERROR_MALFORMED = 1;
  ERROR_UNSUPPORTED_VERSION = 2;
  ERROR_UNKNOWN_COMMAND = 3;
  ERROR_INVALID_ARGUMENT = 4;
  ERROR_OUT_OF_RANGE = 5;
  ERROR_PIPELINE_NOT_READY = 6;
  ERROR_CAPTURE_ENABLED = 7;
  ERROR_BUSY = 8;
  ERROR_EMPTY_COLLECTION = 9;
  ERROR_DUPLICATE_REQUEST_ID = 10;
  ERROR_TIMEOUT = 11;
  ERROR_TRANSPORT_DISCONNECTED = 12;
  ERROR_INTERNAL = 13;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string field = 3;
  bool retryable = 4;
}

enum ResultStatus {
  RESULT_UNSPECIFIED = 0;
  RESULT_ACCEPTED = 1;
  RESULT_SUCCEEDED = 2;
  RESULT_FAILED = 3;
}

message FitProgress {
  uint32 epoch = 1;
  uint32 total_epochs = 2;
  float loss = 3;
  float accuracy = 4;
}

message CommandResult {
  uint32 protocol_version = 1;
  string request_id = 2;
  CommandKind command = 3;
  ResultStatus status = 4;
  uint64 state_version = 5;
  Error error = 6;
  FitProgress progress = 7;
}

enum PipelineState {
  PIPELINE_UNSPECIFIED = 0;
  PIPELINE_DISCONNECTED = 1;
  PIPELINE_NOT_READY = 2;
  PIPELINE_READY = 3;
  PIPELINE_ERROR = 4;
}

enum SourceMode {
  SOURCE_MODE_UNSPECIFIED = 0;
  SOURCE_MODE_SAMPLING = 1;
  SOURCE_MODE_SYNTHETIC = 2;
}

message PipelineStatus {
  PipelineState state = 1;
  SourceMode source_mode = 2;
}

message ActiveTarget {
  uint32 collection_id = 1;
  uint32 label = 2;
  bool capture_enabled = 3;
}

message LabelStatus {
  uint32 label = 1;
  uint32 count = 2;
  uint32 capacity = 3;
}

message CollectionStatus {
  uint32 collection_id = 1;
  uint32 feature_dimension = 2;
  uint64 data_generation = 3;
  repeated LabelStatus labels = 4;
}

enum ModelPhase {
  MODEL_UNSPECIFIED = 0;
  MODEL_IDLE = 1;
  MODEL_QUEUED = 2;
  MODEL_RUNNING = 3;
  MODEL_SUCCEEDED = 4;
  MODEL_FAILED = 5;
  MODEL_CANCELLED = 6;
}

message ModelStatus {
  ModelPhase phase = 1;
  bool ready = 2;
  bool has_source_collection_id = 3;
  uint32 source_collection_id = 4;
  uint64 source_generation = 5;
  bool stale = 6;
  uint32 epoch = 7;
  uint32 total_epochs = 8;
  float loss = 9;
  float accuracy = 10;
  uint64 duration_ms = 11;
}

message StateSnapshot {
  uint32 protocol_version = 1;
  uint64 state_version = 2;
  uint64 timestamp_ns = 3;
  PipelineStatus pipeline = 4;
  ActiveTarget active = 5;
  repeated CollectionStatus collections = 6;
  ModelStatus model = 7;
  Error last_error = 8;
}
