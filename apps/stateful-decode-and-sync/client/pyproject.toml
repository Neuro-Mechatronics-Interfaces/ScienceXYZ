[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "science-stateful-decode-and-sync-client"
version = "0.1.2"
description = "Headless controller, loopback service, calibration client, and PySide6 dashboard"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "protobuf",
  "science-synapse>=2.2.7",
  "PySide6>=6.7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
waveform = ["pyqtgraph>=0.13"]
recording = ["h5py>=3.12", "matplotlib>=3.9", "websockets>=14,<17"]

[project.scripts]
stateful-decode-and-sync-service = "run_service:main"
stateful-decode-and-sync-gui = "run_gui:main"
stateful-decode-and-sync-waveform = "run_waveform:main"
stateful-decode-and-sync-calibration = "calibration_prompter:main"
stateful-decode-and-sync-fake-demo = "run_fake_demo:main"
sciencexyz-calibration-task = "calibration_task:main"
sciencexyz-reactions-bridge = "run_reactions_bridge:main"
sciencexyz-analyze-recording = "analyze_recording:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["run_service", "run_gui", "run_waveform", "calibration_prompter", "run_fake_demo", "calibration_task", "run_reactions_bridge", "analyze_recording"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
# Ship the GUI window/taskbar icon (see stateful_decode_and_sync/appicon.py):
# the SVG for Qt window icons, the PNG for Linux/WSLg .desktop entries.
stateful_decode_and_sync = ["assets/*.svg", "assets/*.png"]
